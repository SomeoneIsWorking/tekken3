name: Asset-free Linux product contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tekken3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86-64 native/Lightrec product
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      PSXPORT_LIGHTREC_DIR: ${{ github.workspace }}/shared/lightrec
      PSXPORT_LIGHTNING_PREFIX: ${{ github.workspace }}/shared/lightning/build/install/linux-x86_64
    steps:
      - name: Check out Tekken 3 with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact maintained Lightrec revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SomeoneIsWorking/lightrec
          ref: b1457137c31cedff5f440d59da29401d021ba2da
          path: shared/lightrec
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact maintained GNU Lightning revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SomeoneIsWorking/lightning
          ref: f305e50483e9794e8fb0b99fb77d82954a4924e5
          path: shared/lightning
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Select Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"

      - name: Install locked uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake clang clang-format clang-tidy cmake glslc libfreetype-dev \
            libtool make \
            libsdl3-dev libsdl3-image-dev ninja-build pkg-config zlib1g-dev

      - name: Build the exact maintained GNU Lightning prefix
        working-directory: shared/lightning
        run: uv run --frozen python tools/build_lightning.py --clean --cc clang --skip-upstream-tests

      - name: Install the locked Python environment
        run: uv sync --locked

      - name: Run the canonical asset-free verifier
        run: uv run --frozen python tools/verify.py
